info:
  name: login (user)
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/v1/auth/login
  body:
    type: json
    data: |-
      {
        "email": "anton@example.com",
        "password": "12345678"
      }
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.token
        method: jsonq
      variable:
        name: token
        scope: runtime
      description: token

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
