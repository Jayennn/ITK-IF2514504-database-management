info:
  name: login (user)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/login"
  body:
    type: form-urlencoded
    data:
      - name: email
        value: admin@example.com
        description: admin
      - name: email
        value: budi@example.com
        description: customer
        disabled: true
      - name: password
        value: "12345678"
  auth: inherit

runtime:
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.token
        method: jsonq
      variable:
        name: token
        scope: runtime
      description: token
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.user.id
        method: jsonq
      variable:
        name: userId
        scope: runtime
      description: user id

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
