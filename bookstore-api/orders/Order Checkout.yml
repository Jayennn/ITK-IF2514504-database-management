info:
  name: Order Checkout
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/orders"
  body:
    type: json
    data: |-
      {
        "user_id": {{userId}},
        "items": [
          {
            "book_id": 9,
            "quantity": 2
          }
        ]
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
