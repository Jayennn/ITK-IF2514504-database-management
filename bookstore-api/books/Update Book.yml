info:
  name: Update Book
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/books/:bookId"
  params:
    - name: bookId
      value: "9"
      type: path
  body:
    type: json
    data: |-
      {
      //   "title": "Calculus",
      //   "author": "Albert Einstein"
      //   "price": 105000,
        "stock_quantity": 2
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
