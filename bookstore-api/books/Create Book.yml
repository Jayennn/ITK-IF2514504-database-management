info:
  name: Create Book
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3000/api/v1/books
  body:
    type: json
    data: |-
      {
        "title": "Calculus",
        "author": "Jayen",
        "price": 105000,
        "stock_quantity": 20
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
