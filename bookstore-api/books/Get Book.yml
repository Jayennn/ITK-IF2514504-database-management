info:
  name: Get Book
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/books/:bookId"
  params:
    - name: bookId
      value: "1"
      type: path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
